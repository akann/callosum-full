<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">API key management with live propagation: solution overview</title>
  <desc id="d">Console page talks to a stateless console API. Writes are one Postgres transaction that also inserts outbox tasks. Workers drain the tasks to the Gateway Auth Store and the Metering Service, write results back, and Postgres NOTIFY drives server-sent events to the page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.6; }
      .ext { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
      .scope { fill: none; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .h { font-size: 16px; font-weight: 700; fill: #111827; }
      .s { font-size: 12.5px; fill: #374151; }
      .m { font-size: 12px; fill: #374151; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #6b7280; }
      .fwd { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .back { stroke: #1d4ed8; stroke-width: 1.8; fill: none; marker-end: url(#arrow-b); }
      .n { fill: #1f2937; } .nb { fill: #1d4ed8; }
      .nt { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .l { font-size: 13.5px; fill: #111827; }
      .state { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
      .st { font-size: 13px; font-weight: 600; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .e { font-size: 11.5px; fill: #374151; text-anchor: middle; }
      .edge { stroke: #1f2937; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">API key management with live propagation</text>
  <text x="30" y="58" class="s">The request path never calls a downstream. Black = change flowing out. Blue = status flowing back.</text>

  <!-- scope boundary -->
  <rect x="270" y="78" width="850" height="212" rx="10" class="scope"/>
  <text x="284" y="96" class="cap">IN SCOPE</text>
  <text x="1190" y="96" class="cap">EXISTING SYSTEMS</text>

  <!-- components -->
  <rect x="30" y="110" width="180" height="150" rx="8" class="box"/>
  <text x="46" y="136" class="h">Console page</text>
  <text x="46" y="160" class="s">React, one EventSource</text>
  <text x="46" y="180" class="s">Secret held in memory,</text>
  <text x="46" y="197" class="s">shown once</text>
  <text x="46" y="221" class="s">Per-system status,</text>
  <text x="46" y="238" class="s">elapsed ticks client-side</text>

  <rect x="290" y="110" width="210" height="150" rx="8" class="box"/>
  <text x="306" y="136" class="h">Console API</text>
  <text x="306" y="160" class="s">Stateless, N instances</text>
  <text x="306" y="180" class="s">Writes: admin only (403),</text>
  <text x="306" y="197" class="s">scoped by customer_id</text>
  <text x="306" y="221" class="s">SSE hub: one LISTEN per</text>
  <text x="306" y="238" class="s">instance, not per viewer</text>

  <rect x="580" y="110" width="220" height="150" rx="8" class="box"/>
  <text x="596" y="136" class="h">Postgres</text>
  <text x="596" y="160" class="m">api_keys</text>
  <text x="596" y="177" class="s">+ status, version</text>
  <text x="596" y="201" class="m">propagation_tasks</text>
  <text x="596" y="218" class="s">the outbox: one row per</text>
  <text x="596" y="235" class="s">key × system × action</text>

  <rect x="880" y="110" width="220" height="150" rx="8" class="box"/>
  <text x="896" y="136" class="h">Propagation workers</text>
  <text x="896" y="160" class="s">Claim: SKIP LOCKED + lease</text>
  <text x="896" y="180" class="s">One task at a time per</text>
  <text x="896" y="197" class="s">key × system, deletes first</text>
  <text x="896" y="221" class="s">Backoff forever, breaker</text>
  <text x="896" y="238" class="s">per downstream</text>

  <rect x="1190" y="104" width="190" height="72" rx="8" class="ext"/>
  <text x="1204" y="128" class="h">Gateway Auth Store</text>
  <text x="1204" y="148" class="s">async: 202 + poll</text>
  <text x="1204" y="165" class="s">may apply out of order</text>

  <rect x="1190" y="194" width="190" height="72" rx="8" class="ext"/>
  <text x="1204" y="218" class="h">Metering Service</text>
  <text x="1204" y="238" class="s">sync, 5% 503, 1% timeout</text>
  <text x="1204" y="255" class="s">after apply, no idempotency</text>

  <!-- forward arrows -->
  <path d="M210 150 H288" class="fwd"/>
  <path d="M500 150 H578" class="fwd"/>
  <path d="M800 150 H878" class="fwd"/>
  <path d="M1100 140 H1188" class="fwd"/>
  <path d="M1100 230 H1188" class="fwd"/>
  <!-- return arrows -->
  <path d="M880 220 H802" class="back"/>
  <path d="M580 220 H502" class="back"/>
  <path d="M290 220 H212" class="back"/>

  <!-- badges -->
  <g><circle cx="249" cy="150" r="11" class="n"/><text x="249" y="150" class="nt">1</text></g>
  <g><circle cx="539" cy="150" r="11" class="n"/><text x="539" y="150" class="nt">2</text></g>
  <g><circle cx="839" cy="150" r="11" class="n"/><text x="839" y="150" class="nt">3</text></g>
  <g><circle cx="1144" cy="140" r="11" class="n"/><text x="1144" y="140" class="nt">4</text></g>
  <g><circle cx="1144" cy="230" r="11" class="n"/><text x="1144" y="230" class="nt">5</text></g>
  <g><circle cx="841" cy="220" r="11" class="nb"/><text x="841" y="220" class="nt">6</text></g>
  <g><circle cx="541" cy="220" r="11" class="nb"/><text x="541" y="220" class="nt">7</text></g>
  <g><circle cx="251" cy="220" r="11" class="nb"/><text x="251" y="220" class="nt">8</text></g>

  <!-- legend -->
  <text x="30" y="330" class="cap">FLOW</text>
  <g>
    <circle cx="41" cy="356" r="10" class="n"/><text x="41" y="356" class="nt">1</text>
    <text x="62" y="361" class="l">Create or revoke. The 201 carries the secret, once. p95 well under 200 ms.</text>
    <circle cx="41" cy="386" r="10" class="n"/><text x="41" y="386" class="nt">2</text>
    <text x="62" y="391" class="l">One transaction: key row + outbox tasks. Stores sha256 only. No downstream call.</text>
    <circle cx="41" cy="416" r="10" class="n"/><text x="41" y="416" class="nt">3</text>
    <text x="62" y="421" class="l">NOTIFY wakes a worker. It claims a task and records the attempt before sending.</text>
    <circle cx="41" cy="446" r="10" class="n"/><text x="41" y="446" class="nt">4</text>
    <text x="62" y="451" class="l">PUT / DELETE with a stored Idempotency-Key, then poll the operation every 1 s.</text>
    <circle cx="41" cy="476" r="10" class="n"/><text x="41" y="476" class="nt">5</text>
    <text x="62" y="481" class="l">POST / DELETE with a 3 s timeout. 409 on create and 404 on delete count as done.</text>
    <circle cx="41" cy="506" r="10" class="nb"/><text x="41" y="506" class="nt">6</text>
    <text x="62" y="511" class="l">One transaction: task result, key status re-derived, version + 1.</text>
    <circle cx="41" cy="536" r="10" class="nb"/><text x="41" y="536" class="nt">7</text>
    <text x="62" y="541" class="l">NOTIFY key_changed carries ids only. The API re-reads the key.</text>
    <circle cx="41" cy="566" r="10" class="nb"/><text x="41" y="566" class="nt">8</text>
    <text x="62" y="571" class="l">SSE: full snapshot on every connect, then one event per changed key. Under 2 s.</text>
  </g>

  <text x="30" y="616" class="cap">WHY IT HOLDS</text>
  <text x="30" y="640" class="l">Outage up to 1 h: tasks wait in Postgres and retry. Worker crash: the lease expires and the call repeats safely.</text>
  <text x="30" y="662" class="l">Revoke cancels a create that was never sent; otherwise the create settles first, then the delete runs.</text>

  <!-- state machine -->
  <rect x="700" y="312" width="680" height="366" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="718" y="338" class="cap">KEY STATUS</text>

  <rect x="722" y="430" width="130" height="40" rx="20" class="state" stroke-dasharray="5 4"/>
  <text x="787" y="450" class="st">provisioning</text>
  <rect x="930" y="430" width="90" height="40" rx="20" class="state"/>
  <text x="975" y="450" class="st">active</text>
  <rect x="1098" y="430" width="104" height="40" rx="20" class="state" stroke-width="2.6"/>
  <text x="1150" y="450" class="st">revoking</text>
  <rect x="1270" y="430" width="92" height="40" rx="20" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1316" y="450" class="st">revoked</text>
  <rect x="742" y="580" width="90" height="40" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="787" y="600" class="st">failed</text>

  <path d="M852 450 H928" class="edge"/>
  <text x="890" y="424" class="e">both systems</text>
  <text x="890" y="438" class="e">confirm</text>

  <path d="M1020 450 H1096" class="edge"/>
  <text x="1058" y="438" class="e">revoke</text>

  <path d="M1202 450 H1268" class="edge"/>
  <text x="1235" y="424" class="e">both</text>
  <text x="1235" y="438" class="e">removed</text>

  <path d="M787 430 C787 362, 1150 362, 1150 428" class="edge"/>
  <text x="968" y="366" class="e">revoke during provisioning: beats the in-flight create, never rolled back</text>

  <path d="M787 470 V578" class="edge"/>
  <text x="800" y="516" class="e" style="text-anchor:start">gateway rejects the key</text>
  <text x="800" y="532" class="e" style="text-anchor:start">→ remove its meter</text>

  <text x="1010" y="560" class="e" style="text-anchor:start">While revoking, the page warns the key may</text>
  <text x="1010" y="576" class="e" style="text-anchor:start">still be accepted until the gateway confirms.</text>
  <text x="1010" y="604" class="e" style="text-anchor:start">A late create result can never move a key</text>
  <text x="1010" y="620" class="e" style="text-anchor:start">back: every transition is guarded on the</text>
  <text x="1010" y="636" class="e" style="text-anchor:start">current status.</text>
</svg>
